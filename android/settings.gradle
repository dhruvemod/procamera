pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'pro_camera_app_android'
include ':app'

apply from: new File(
  settings.pluginManagement.resolutionStrategy.eachPlugin.find { it.requested.id.id == 'dev.flutter.flutter-gradle-plugin' }.origin.location,
  'flutter.groovy'
)
